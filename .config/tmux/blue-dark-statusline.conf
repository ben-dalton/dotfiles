set -g mode-style "fg=#CDD6F5,bg=#073642"

set -g message-style "fg=#CDD6F5,bg=#073642"
set -g message-command-style "fg=#CDD6F5,bg=#073642"

set -g pane-border-style "fg=#073642"
set -g pane-active-border-style "fg=#CDD6F5"

set -g status "on"
set -g status-interval 1
set -g status-justify "left"

set -g status-style "fg=#586e75,bg=#1e1e2e"

set -g status-bg "#0E0F10"

set -g status-left-length "100"
set -g status-right-length "200"

set -g status-left-style NONE
set -g status-right-style NONE

set -g status-interval 15
WEATHER='#(curl -s wttr.in/CLT\?u\&format\="%%c%%20%%t%%20%%w&period=60")'
# WEATHER=''
MUSIC="#( ~/.config/scripts/ytmd_status.sh ) "

set -g status-left "#[fg=#ffffff,bg=#454B66,nobold] #S #[fg=#454B66,bg=#0E0F10,nobold,nounderscore,noitalics]"
# #[fg=#15161E,bg=#93a1a1,bold] #(whoami) #[fg=#93a1a1,bg=#0E0F10]

set -g status-right "#[fg=#89B4FB,bg=#0E0F10,nobold,nounderscore,noitalics]#{?client_prefix,#[reverse] ┣━#[noreverse],}#[fg=#0E0F10,bg=#0E0F10,nobold,nounderscore,noitalics]#[fg=#89B4FB,bg=#0E0F10] $MUSIC $WEATHER #[fg=#454B66,bg=#0E0F10]#[fg=#ffffff,bg=#454B66] %a, %b %d %l:%M %p "

setw -g window-status-activity-style "underscore,fg=#89B4FB,bg=#CDD6F5"
setw -g window-status-separator ""
setw -g window-status-style "NONE,fg=#89B4FB,bg=#313244"
setw -g window-status-format '#[fg=#0E0F10,bg=#313244]#[default] #I  #W #[fg=#313244,bg=#0E0F10,nobold,nounderscore,noitalics]'
setw -g window-status-current-format '#[fg=#0E0F10,bg=#89B4FB]#[fg=#0E0F10,bg=#89B4FB] #I #[fg=#0E0F10,bg=#89B4FB] #W #[fg=#89B4FB,bg=#0E0F10,nobold]'

